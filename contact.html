<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
      background-color: #61748c;
    }

    .navbar .nav-link {
      color: #ffffff !important;
    }

    .navbar-brand {
      color: white !important;
      font-weight: bold;
    }

    footer {
      background-color: #61748c;
      color: white;
      padding: 20px 0;
    }

    .form-control {
      border-radius: 0.25rem;
    }

    .btn-primary {
      background-color: #8f7a6a;
      border: none;
    }

    .btn-primary:hover {
      background-color: #715c4e;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Brand</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="book.html">Rooms</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Us Section -->
  <div class="container mt-5">
    <h1 class="text-center">Contact Us</h1>
    <p class="text-center text-muted">We'd love to hear from you! Fill out the form below or reach out to us directly.</p>
    <div class="row mt-5">
      <!-- Contact Form -->
      <div class="col-md-6">
        <form>
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Write your message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        </form>
      </div>

      <!-- Contact Details -->
      <div class="col-md-6">
        <h4>Our Address</h4>
        <p><i class="fa fa-map-marker-alt"></i> 308 Watkins Lane, St. Michaels, MD, 21663</p>
        <p><i class="fa fa-phone"></i> 1-410-745-2200</p>
        <p><i class="fa fa-envelope"></i> info@inntravel.com</p>
        <p><i class="fa fa-globe"></i> www.inntravel.com</p>
        <h4>Find Us</h4>
        <div class="embed-responsive embed-responsive-16by9">
          <iframe class="embed-responsive-item" 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.96305791531593!3d-37.81362797975179!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43f1f7a15f%3A0x4f0f9e1a9b9b6141!2s308+Watkins+Ln%2C+St+Michaels%2C+MD+21663%2C+USA!5e0!3m2!1sen!2s!4v1646476615243!5m2!1sen!2s" 
            allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center mt-5">
    <p>&copy; 2025 Inn Travel Tourism. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
